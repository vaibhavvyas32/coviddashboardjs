<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="COVID-19 cases, recoveries and deaths for every country, with daily history, a world map and rankings."
    />
    <meta name="theme-color" content="#f6f5fa" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0c0a14" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>COVID-19 dashboard | Vaibhav Vyas</title>
    <script>
      // Apply the saved or system theme before first paint, so the page never flashes the wrong colours.
      (function () {
        try {
          var saved = localStorage.getItem("theme");
          var dark = saved ? saved === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
          document.documentElement.classList.toggle("dark", dark);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/index.jsx"></script>
  </body>
</html>
